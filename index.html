<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/student_logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Launch Point – Study Hard. Work Hard.</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-width: 100%;
        min-height: 100%;
        background: #09090b;
      }

      body {
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
        background: #09090b;
      }

      /* ---------- Minimal silver loader on black ---------- */
      .initial-loader {
        width: 100%;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;

        background: #09090b;

        font-family:
          "Space Grotesk",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      .loader-ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;

        /* faint full track + bright silver arc on top */
        border: 1.5px solid rgba(255, 255, 255, 0.07);
        border-top-color: #e4e4e7;
        border-right-color: rgba(228, 228, 231, 0.35);

        box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);

        animation: lp-spin 0.95s cubic-bezier(0.62, 0.05, 0.36, 1) infinite;
      }

      .loader-brand {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        text-transform: uppercase;

        background: linear-gradient(
          100deg,
          #3f3f46 0%,
          #a1a1aa 40%,
          #ffffff 50%,
          #a1a1aa 60%,
          #3f3f46 100%
        );
        background-size: 220% auto;

        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;

        animation: lp-shimmer 3.2s linear infinite;
      }

      @keyframes lp-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes lp-shimmer {
        from {
          background-position: 200% center;
        }
        to {
          background-position: -20% center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-ring {
          animation-duration: 2.5s;
        }
        .loader-brand {
          animation-duration: 5s;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="loader-ring"></div>
        <div class="loader-brand">Launch Point</div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
